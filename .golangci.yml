# golangci-lint configuration for toykv.
#
# Policy:
#   - Security findings (gosec) are BLOCKING — fix or //nolint:gosec with reason.
#   - Correctness findings (govet, errcheck, staticcheck, ineffassign, unused) are BLOCKING.
#   - Style findings (revive, gocritic, misspell, gofmt) are advisory but enforced
#     in CI to keep diffs clean.
#
# See docs/adr/ for rationale (ADRs land post-code per docs/adr/README.md).

run:
  timeout: 5m
  tests: true
  # Analysis target matches go.mod. The CI workflow uses
  # install-mode: goinstall so golangci-lint is built from source with
  # the runner's Go 1.26 toolchain (the prebuilt binary cannot parse
  # 1.26 source).
  go: '1.26'

linters:
  disable-all: true
  enable:
    - errcheck
    - gocritic
    - gofmt
    - gosec
    - govet
    - ineffassign
    - misspell
    - revive
    - staticcheck
    - unused

linters-settings:
  gofmt:
    simplify: true
  gocritic:
    enabled-tags:
      - diagnostic
      - performance
      - style
    disabled-checks:
      - ifElseChain
      - hugeParam
      # exitAfterDefer: cmd/* main funcs intentionally use os.Exit after
      # defer for cancel/cleanup; the OS reclaims on exit anyway.
      - exitAfterDefer
      # unnamedResult: stylistic preference; multi-return signatures here
      # are short and the names would add noise.
      - unnamedResult
      # evalOrder: Bubble Tea pattern returns (model, cmd) from update
      # branches; rewriting to please the linter hurts readability.
      - evalOrder
      # paramTypeCombine / preferStringWriter: stylistic, no correctness
      # value here.
      - paramTypeCombine
      - preferStringWriter
  revive:
    rules:
      - name: var-naming
      - name: package-comments
      - name: indent-error-flow
      - name: error-return
      - name: error-naming
      - name: exported
        arguments:
          - disableStutteringCheck
  gosec:
    excludes:
      # G104: errors unhandled — covered by errcheck with broader visibility.
      - G104
      # G115: integer overflow on int↔uint conversions. Too noisy in code
      # that uses len() (always non-negative), time.Now().UnixNano(), and
      # AOF offsets where overflow is structurally impossible. Real overflow
      # risks are caught by govet's stdversion/conversion checks.
      - G115

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - gosec
        - errcheck
        - revive
  max-issues-per-linter: 0
  max-same-issues: 0
