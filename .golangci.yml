# golangci-lint configuration for toykv (schema v2).
#
# Policy:
#   - Security findings (gosec) are BLOCKING — fix or //nolint:gosec with reason.
#   - Correctness findings (govet, errcheck, staticcheck, ineffassign, unused) are BLOCKING.
#   - Style findings (revive, gocritic, misspell) and formatting (gofmt) are
#     advisory but enforced in CI to keep diffs clean.
#
# Migrated from the v1 schema when the local toolchain moved to golangci-lint
# v2 (v1 config is rejected with "unsupported version of the configuration").
# CI installs v2 via golangci-lint-action@v8 + install-mode:goinstall so the
# Go 1.26 source builds. See docs/adr/ for rationale.
version: "2"
run:
  go: "1.26"
  tests: true
linters:
  default: none
  enable:
    - errcheck
    - gocritic
    - gosec
    - govet
    - ineffassign
    - misspell
    - revive
    - staticcheck
    - unused
  settings:
    gocritic:
      disabled-checks:
        - ifElseChain
        - hugeParam
        - exitAfterDefer
        - unnamedResult
        - evalOrder
        - paramTypeCombine
        - preferStringWriter
      enabled-tags:
        - diagnostic
        - performance
        - style
    gosec:
      excludes:
        - G104
        - G115
    revive:
      rules:
        - name: var-naming
        - name: package-comments
        - name: indent-error-flow
        - name: error-return
        - name: error-naming
        - name: exported
          arguments:
            - disableStutteringCheck
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - errcheck
          - gosec
          - revive
        path: _test\.go
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofmt
  settings:
    gofmt:
      simplify: true
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
