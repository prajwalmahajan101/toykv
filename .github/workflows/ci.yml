name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          check-latest: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          # goinstall mode required for Go 1.26 source — prebuilt binary
          # cannot parse it.
          install-mode: goinstall
          args: --timeout=5m

  test:
    name: test (${{ matrix.os }} / go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        go: ['1.25.x', '1.26.x']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          check-latest: true
      - name: install redis-tools (ubuntu only)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends redis-tools
      - name: vet
        run: go vet ./...
      - name: unit tests
        run: go test -race -timeout 5m $(go list ./... | grep -v /test/e2e)
      - name: e2e tests
        run: go test -race -timeout 10m ./test/e2e/...

  chaos-smoke:
    name: chaos-smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          check-latest: true
      - name: chaos soak (short, ~30s)
        run: go test -short -race -timeout 3m ./test/chaos/...

  build:
    name: build
    runs-on: ubuntu-latest
    needs: [lint, test, chaos-smoke]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          check-latest: true
      - name: build all binaries
        run: make build
      - name: smoke --help
        run: |
          ./bin/toykv --help     | head -1
          ./bin/toykv-cli --help | head -1
          ./bin/toykv-tui --help | head -1
